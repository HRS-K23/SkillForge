spring.application.name=skillforge

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/skillforge}
spring.datasource.username=${DB_USERNAME:skillforge}
spring.datasource.password=${DB_PASSWORD:skillforge}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
server.error.include-message=never

skillforge.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
skillforge.security.jwt.expiration-minutes=60
skillforge.content.root=${CONTENT_ROOT:../content}

spring.flyway.locations=classpath:db/migration,classpath:db/{vendor}
skillforge.admin.emails=${ADMIN_EMAILS:}

skillforge.frontend.base-url=${FRONTEND_URL:http://localhost:3000}
skillforge.password-reset.expiration-minutes=30
skillforge.mail.enabled=${MAIL_ENABLED:false}
skillforge.mail.from=${MAIL_FROM:no-reply@skillforge.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true